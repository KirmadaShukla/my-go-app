services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mygoapp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mygoapp"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: local
        COMMIT: local
        BUILD_TIME: local
    ports:
      - "8080:8080"
    environment:
      APP_ENV: production
      HTTP_ADDR: ":8080"
      LOG_LEVEL: info
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/mygoapp?sslmode=disable
      JWT_SECRET: change-me-in-real-deployments-use-long-random
      JWT_EXPIRY: 24h
      HTTP_WRITE_TIMEOUT: 120s
      DEFAULT_CHAT_MODEL: ${DEFAULT_CHAT_MODEL:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-2.5-flash-lite}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      OPENAI_TTS_MODEL: ${OPENAI_TTS_MODEL:-tts-1}
      OPENAI_TTS_VOICE: ${OPENAI_TTS_VOICE:-nova}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
